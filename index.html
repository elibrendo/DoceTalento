<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[Nome da sua marca] · Links e catálogo</title>
  <meta name="description" content="[Uma frase curta sobre o que você vende e para quem]">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">

    <header class="perfil">
      <div class="avatar ph">
        <!-- Troque pela sua logo: <img src="img/logo.png" alt="Logo da marca"> -->
        <span>Sua logo</span>
      </div>
      <h1 class="perfil__nome">[Nome da sua marca]</h1>
      <p class="perfil__bio">[Uma frase curta sobre o que você vende e para quem]</p>

      <nav class="redes" aria-label="Redes sociais">
        <a class="rede" href="https://instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6"/></svg>
        </a>
        <a class="rede" href="https://tiktok.com/" target="_blank" rel="noopener" aria-label="TikTok">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.6 2.6 2.4 4.2 5 4.5"/></svg>
        </a>
        <a class="rede" href="https://wa.me/" target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3.5 20.5l1.4-4.2A8.5 8.5 0 1 1 8 19.3z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8c-1-.4-1.9-1.3-2.3-2.3l.8-1-1-2z"/></svg>
        </a>
        <a class="rede" href="https://youtube.com/" target="_blank" rel="noopener" aria-label="YouTube">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
        </a>
        <a class="rede" href="mailto:contato@suamarca.com" aria-label="E-mail">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>
        </a>
      </nav>
    </header>

    <section class="links" aria-label="Links principais">
      <a class="botao botao--destaque" id="link-whatsapp" href="https://wa.me/" target="_blank" rel="noopener">Fale comigo no WhatsApp</a>
      <a class="botao" href="https://suamarca.com" target="_blank" rel="noopener">Visite o site</a>
      <a class="botao" href="#catalogo">Ver catálogo ↓</a>
    </section>

    <section class="catalogo" id="catalogo" aria-label="Catálogo">
      <div class="catalogo__topo">
        <h2>Catálogo</h2>
        <span class="catalogo__contagem" id="contagem" aria-live="polite"></span>
      </div>
      <div class="filtros" id="filtros" role="group" aria-label="Filtrar produtos"></div>
      <div class="grade" id="grade"></div>
    </section>

    <footer class="rodape">© [Nome da sua marca] · Pedidos pelo WhatsApp</footer>
  </main>

  <script src="js/produtos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
